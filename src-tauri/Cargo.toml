[package]
name = "nexora"
version = "0.1.0"
description = "Nexora: a Windows Roblox toolkit"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
# Only for the IPC boundary test: the mock runtime and `get_ipc_response`. No new crates.
tauri = { version = "2", features = ["test"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
