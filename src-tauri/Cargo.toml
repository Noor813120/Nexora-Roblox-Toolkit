[package]
name = "roalt-advanced"
version = "0.1.0"
description = "RoALT Advanced: a Windows account manager and launcher for Roblox"
edition = "2024"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_SystemInformation"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
